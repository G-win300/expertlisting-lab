# Local development: Postgres + api + web, built from the same Dockerfiles as production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expertlisting
      POSTGRES_USER: app
      POSTGRES_PASSWORD: localpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d expertlisting"]
      interval: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DB_HOST: db
      DB_NAME: expertlisting
      DB_USER: app
      DB_PASSWORD: localpassword
      DB_SSL: "false"
      SERVED_BY: local
      ENABLE_BURN: "true"
    command: sh -c "node migrate.js && node src/server.js"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "8080:80"
    volumes:
      - ./web/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
