# Used only by docker compose on your laptop: there's no ALB locally,
# so nginx proxies /api/ to the api container itself.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
