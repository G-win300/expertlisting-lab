<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expert Listing lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #16211c;
      --muted: #5c6b63;
      --line: #d9e1dc;
      --paper: #ffffff;
      --ecs: #145a43;
      --legacy: #a8570a;
      --local: #3b4a8f;
      --error: #b3261e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    main { max-width: 760px; margin: 0 auto; padding: 48px 20px 64px; }
    .brand { font-weight: 600; color: var(--muted); margin: 0 0 40px; }
    .backend {
      font-size: clamp(2.2rem, 7vw, 3.6rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 12px;
      color: var(--backend-color, var(--ink));
    }
    .backend-note { color: var(--muted); margin: 0 0 32px; max-width: 60ch; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 24px; margin: 0 0 48px; }
    dt { color: var(--muted); }
    dd { margin: 0; font-variant-numeric: tabular-nums; word-break: break-all; }
    .mismatch { color: var(--error); font-weight: 600; }
    h2 { font-size: 1.1rem; margin: 0 0 8px; }
    ul { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
    li {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 16px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }
    .title { font-weight: 600; }
    .meta { color: var(--muted); grid-column: 1; }
    .price { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-weight: 600; font-variant-numeric: tabular-nums; }
    .error { color: var(--error); padding: 14px 0; }
    button {
      font: inherit; font-weight: 600;
      margin-top: 24px; padding: 10px 18px;
      border: 2px solid var(--ink); background: var(--paper); color: var(--ink);
      border-radius: 6px; cursor: pointer;
    }
    button:hover { background: var(--ink); color: var(--paper); }
    button:focus-visible { outline: 3px solid var(--ecs); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Samson lab</p>

    <h1 class="backend" id="backend">Checking which backend answered…</h1>
    <p class="backend-note" id="backend-note">Reload the page during a deploy or a DNS cutover to watch this change.</p>

    <dl>
      <dt>API build</dt><dd id="api-version">–</dd>
      <dt>Web build</dt><dd id="web-version">–</dd>
      <dt>Answered by</dt><dd id="host">–</dd>
    </dl>

    <h2>Verified listings</h2>
    <ul id="listings"></ul>

    <button type="button" id="refresh">Refresh</button>
  </main>

  <script>
    const LABELS = {
      'legacy':      { text: 'Served by the legacy server', color: 'var(--legacy)', note: 'Single EC2 instance, deployed by SSH and git pull.' },
      'ecs-prod':    { text: 'Served by ECS on Fargate',     color: 'var(--ecs)',    note: 'Production containers behind the load balancer.' },
      'ecs-staging': { text: 'Staging on ECS Fargate',       color: 'var(--ecs)',    note: 'Every merge to main lands here before production.' },
      'local':       { text: 'Running locally',              color: 'var(--local)',  note: 'docker compose on your machine.' }
    };
    const naira = new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', maximumFractionDigits: 0 });
    const short = (v) => (v && v.length > 12 ? v.slice(0, 7) : v || 'unknown');

    async function load() {
      const backendEl = document.getElementById('backend');
      const list = document.getElementById('listings');
      try {
        const [info, webVersion] = await Promise.all([
          fetch('/api/info', { cache: 'no-store' }).then((r) => r.json()),
          fetch('/version.txt', { cache: 'no-store' }).then((r) => r.text()).then((t) => t.trim()).catch(() => 'unknown')
        ]);
        const label = LABELS[info.servedBy] || { text: 'Served by ' + info.servedBy, color: 'var(--ink)', note: '' };
        backendEl.textContent = label.text;
        document.documentElement.style.setProperty('--backend-color', label.color);
        document.getElementById('backend-note').textContent = label.note;
        document.getElementById('api-version').textContent = short(info.version);
        const webEl = document.getElementById('web-version');
        webEl.textContent = short(webVersion);
        webEl.className = webVersion === info.version ? '' : 'mismatch';
        if (webVersion !== info.version) webEl.textContent += ' (differs from API build)';
        document.getElementById('host').textContent = info.host;
      } catch (e) {
        backendEl.textContent = 'The API did not respond';
        document.getElementById('backend-note').textContent = 'Check /api/health and the api service logs.';
      }

      try {
        const res = await fetch('/api/listings', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const rows = await res.json();
        list.innerHTML = '';
        for (const l of rows) {
          const li = document.createElement('li');
          li.innerHTML = '<span class="title"></span><span class="meta"></span><span class="price"></span>';
          li.querySelector('.title').textContent = l.title;
          li.querySelector('.meta').textContent = l.city + ', ' + l.listing_type.replace('-', ' ');
          li.querySelector('.price').textContent = naira.format(Number(l.price_ngn));
          list.appendChild(li);
        }
        if (!rows.length) list.innerHTML = '<li class="error">No listings yet. Run the migrations to seed them.</li>';
      } catch (e) {
        list.innerHTML = '<li class="error">Listings failed to load (' + e.message + '). The database may not be migrated yet.</li>';
      }
    }

    document.getElementById('refresh').addEventListener('click', load);
    load();
  </script>
</body>
</html>
